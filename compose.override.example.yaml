# Copy to compose.override.yaml (git-ignored) and list your media folders.
# Each folder becomes browsable under /media when creating a library. Always mount read-only.
services:
  api:
    volumes:
      - /path/to/Films:/media/Films:ro
      - /path/to/Series:/media/Series:ro
    # Optional hardware transcoding (Intel/AMD): expose only the render node and its group.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - "992"   # stat -c %g /dev/dri/renderD128
