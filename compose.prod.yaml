name: toto

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-toto}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: toto-api:latest
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-toto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-toto}?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${MEDIA_DIR:?MEDIA_DIR is required}:/media:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: toto-web:latest
    build:
      context: ./web
      target: prod
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_PORT:-8096}:8080"
    depends_on:
      - api

volumes:
  db-data:
