# Plys, ready to run from the published images (Docker Hub). Setup: see "Installation" in the README.
#   docker compose -f compose.prod.yaml up -d
name: plys

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plys}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${PLYS_NAMESPACE:-glide}/plys-api:${PLYS_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-plys}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plys}?sslmode=disable
      # Keep false when browsing over plain http (LAN); set true behind an HTTPS reverse proxy.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_TRANSCODES: ${MAX_TRANSCODES:-2}
    volumes:
      # Everything below /media is offered when creating a library. Always read-only.
      - ${MEDIA_DIR:?Set MEDIA_DIR in .env}:/media:ro
      - api-cache:/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${PLYS_NAMESPACE:-glide}/plys-web:${PLYS_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_PORT:-8096}:8080"
    depends_on:
      - api

volumes:
  db-data:
  api-cache:
