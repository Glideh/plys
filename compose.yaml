# Development environment: `docker compose up`. Production: deploy/compose/compose.prod.yaml.
# Distinct project name keeps dev images and volumes apart from production ones.
name: toto-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toto
      POSTGRES_PASSWORD: toto
      POSTGRES_DB: toto
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toto -d toto"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: toto-api:dev
    build:
      context: ./api
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: air -c .air.toml
    environment:
      DATABASE_URL: postgres://toto:toto@db:5432/toto?sslmode=disable
      TEST_DATABASE_URL: postgres://toto:toto@db:5432/toto_test?sslmode=disable
      COOKIE_SECURE: "false"
      PLYS_FEDERATION_REQUIRE_HTTPS: "false"
      LOG_LEVEL: debug
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    volumes:
      - ./api:/src
      - ./VERSION:/version:ro
      - go-cache:/go-cache
      - api-cache:/cache
    # Media folders are mounted under /media by compose.override.yaml (see compose.override.example.yaml).
    # All interfaces: other federated servers reach this API by LAN IP.
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: toto-web:dev
    build:
      context: ./web
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    # All interfaces: peers and browsers reach this front by LAN IP.
    ports:
      - "5173:5173"
    depends_on:
      - api

  sqlc:
    image: sqlc/sqlc:1.29.0
    profiles: [tools]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    volumes:
      - ./api:/src

  android-build: &android-build
    image: plys-android-tools:dev
    platform: linux/amd64
    build:
      context: ./android-tv/docker
      target: build
    profiles: [android]
    environment:
      LOCAL_UID: ${UID:-1000}
      LOCAL_GID: ${GID:-1000}
    volumes:
      - ./android-tv:/workspace
      - ${ANDROID_GRADLE_CACHE:-android-gradle}:/root/.gradle
      - android-home:/root/.android
    security_opt: ["no-new-privileges:true"]

  android-emulator:
    <<: *android-build
    image: plys-android-emulator:dev
    build:
      context: ./android-tv/docker
      target: emulator
    profiles: [android-test]
    devices:
      - /dev/kvm:/dev/kvm
    command: [emulator]
    healthcheck:
      test: ["CMD-SHELL", "adb -s emulator-5554 shell getprop sys.boot_completed | grep -q '^1'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  android-test:
    <<: *android-build
    profiles: [android-test]
    network_mode: service:android-emulator
    depends_on:
      android-emulator:
        condition: service_healthy
    command: [":app:connectedDebugAndroidTest"]

volumes:
  db-data:
  go-cache:
  api-cache:
  web-node-modules:
  android-gradle:
    name: plys-android-gradle
  android-home:
    name: plys-android-avd
