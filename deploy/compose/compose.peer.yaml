# Second dev instance on the same machine, for federation tests.
# Usage: docker compose -f deploy/compose/compose.peer.yaml up -d
# Front: http://<LAN-IP>:5175, API: http://<LAN-IP>:8081. Own database, own identity.
name: toto-peer

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toto
      POSTGRES_PASSWORD: toto
      POSTGRES_DB: toto
    volumes:
      - peer-db-data:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toto -d toto"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: toto-peer-api:dev
    build:
      context: ../../api
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: air -c .air.toml
    environment:
      DATABASE_URL: postgres://toto:toto@db:5432/toto?sslmode=disable
      TEST_DATABASE_URL: postgres://toto:toto@db:5432/toto_test?sslmode=disable
      COOKIE_SECURE: "false"
      PLYS_FEDERATION_REQUIRE_HTTPS: "false"
      LOG_LEVEL: debug
    volumes:
      - ../../api:/src
      - ../../VERSION:/version:ro
      - peer-go-cache:/go-cache
      - peer-api-cache:/cache
      - /media/volume2:/media:ro
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: toto-peer-web:dev
    build:
      context: ../../web
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ../../web:/app
      - peer-web-node-modules:/app/node_modules
    ports:
      - "5175:5173"
    depends_on:
      - api

volumes:
  peer-db-data:
  peer-go-cache:
  peer-api-cache:
  peer-web-node-modules:
