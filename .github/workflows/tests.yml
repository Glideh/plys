# Tests: Go vet + tests (with PostgreSQL and ffmpeg), web type checks + tests, Android unit tests + lint.
# On a push to develop whose VERSION differs from master's, a green run then promotes the commit: master is
# fast-forwarded to it and the Release workflow is started on master. master only receives tested commits
# this way, so it has no push trigger here and the release does not run the tests again.
name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Pushes are never cancelled, so a run cannot stop between the promotion and the release dispatch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (go vet, go test)
    runs-on: ubuntu-24.04
    # Same Go and Debian as the api image, so ffmpeg matches the one the server runs with.
    container: golang:1.26-trixie
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toto
          POSTGRES_PASSWORD: toto
          POSTGRES_DB: toto_test
        options: >-
          --health-cmd "pg_isready -U toto -d toto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://toto:toto@postgres:5432/toto_test?sslmode=disable
      # Database tests fail instead of being skipped when the database is missing.
      TESTDB_REQUIRED: "1"
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: go-${{ hashFiles('api/go.sum') }}
          restore-keys: go-
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web (typecheck, vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: Android TV (unit tests, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run as the runner user
        run: printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
      - run: docker compose --profile android build android-build
      - run: docker compose --profile android run --rm android-build :app:testDebugUnitTest :app:lintDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android-tv/app/build/reports/
          if-no-files-found: ignore

  promote:
    name: Promote to master
    needs: [api, web, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Optional: a deploy key allowed to bypass the master ruleset. Without it the job token pushes.
          ssh-key: ${{ secrets.MASTER_DEPLOY_KEY }}
      - id: check
        name: Compare VERSION with master
        run: |
          version="$(.github/scripts/check-release.sh)"
          released="$(git show origin/master:VERSION | tr -d '[:space:]')"
          if [[ "$version" == "$released" ]]; then
            echo "VERSION $version is already on master: nothing to release."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION $released on master, $version on develop: promoting $GITHUB_SHA."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fast-forward master
        if: steps.check.outputs.promote == 'true'
        run: |
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "::error::master has commits that are not on develop: merge master into develop first."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/master"
      - name: Start the release on master
        if: steps.check.outputs.promote == 'true'
        # Retried in case the dispatch API does not see the new master yet. If it still fails, start Release by
        # hand on master: VERSION now matches, so a later push would not promote again.
        run: |
          for attempt in 1 2 3; do
            gh workflow run release.yml --ref master && exit 0
            sleep 10
          done
          exit 1
