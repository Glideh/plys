name: Tests Web, API, Android

on:
  push:
    branches:
      - feature/pipelines

jobs:
  test-web:
    name: Tests web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d api
      - run: sleep 5
      - run: docker compose exec api go test ./...
      - run: docker compose exec api go vet ./...
      - if: always()
        run: docker compose down
