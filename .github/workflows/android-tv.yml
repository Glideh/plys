# Android TV: builds the signed release APK and uploads it as the `android-tv-apk` artifact.
# Called by the Release workflow, which attaches the APK to the GitHub release.
# The app updates itself from these releases, and Android only accepts an update signed with the installed app's
# key: the APK is signed with the pinned keystore of the `release` environment (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). All are required.
name: Android TV

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Run as the runner user
        run: printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
      - run: docker compose --profile android build android-build
      - name: Pinned signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android-tv/release.keystore
      - name: Build
        env:
          PLYS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLYS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLYS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-signed.sh
      - name: Remove the keystore
        if: always()
        run: rm -f android-tv/release.keystore
      - uses: actions/upload-artifact@v7
        with:
          name: android-tv-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
