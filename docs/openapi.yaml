openapi: 3.1.0
info:
  title: Plys API
  version: 0.7.6
  description: |
    Media library API used by the web front-end and the native Android TV client.

    Authentication: short-lived JWT access token (`Authorization: Bearer`) plus a rotating
    refresh token. Web clients request `tokenDelivery: cookie` (HttpOnly, SameSite=Strict,
    path `/api/v1/auth`); mobile clients use `tokenDelivery: body` and store the refresh token
    in secure storage. Presenting an already-rotated refresh token revokes the whole session.
servers:
  - url: /api/v1
security:
  - bearer: []

paths:
  /server:
    get:
      operationId: getServerInfo
      summary: Public identity of this server (used by clients and federated peers)
      security: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                type: object
                required: [id, name, version, publicKey]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  version: { type: string }
                  publicKey: { type: string, description: Base64 Ed25519 public key }

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Tell whether the first admin account still has to be created
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [needsSetup]
                properties:
                  needsSetup: { type: boolean }

  /setup/admin:
    post:
      operationId: setupAdmin
      summary: Create the first admin account (only once)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - $ref: "#/components/schemas/SessionOptions"
                - type: object
                  properties:
                    locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Setup already completed (`already_initialized`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - $ref: "#/components/schemas/SessionOptions"
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Invalid credentials (`invalid_credentials`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Too many attempts (`rate_limited`): 20 per minute per client address and 5 per minute per account.
            Each new block doubles the wait, up to 15 minutes; a successful login resets the account counter.
            Retry after the delay in `Retry-After` (seconds).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      description: Reads the token from the body, or from the `refresh_token` cookie when the body is empty.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: Refresh token invalid, expired or revoked (`invalid_refresh_token`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the session bound to the refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Logged out }

  /auth/device:
    post:
      operationId: startDeviceLogin
      summary: Start a sign-in approved from a phone (TV)
      description: >
        The TV shows `userCode` and a QR code of `verificationUrl`, then polls `deviceLoginToken` with `deviceCode`
        every `interval` seconds. The request expires after 10 minutes and opens at most one session. Limited to 10
        requests per minute and client address.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceName: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Request started
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verificationUrl, expiresAt, interval]
                properties:
                  deviceCode: { type: string, description: Secret kept by the TV; only it can collect the session }
                  userCode: { type: string, example: BCDF-GHJK, description: Shown on the TV and checked on the phone }
                  verificationUrl:
                    type: string
                    description: >
                      `<public URL>/link?code=<userCode>`; empty when the server has no public URL, in which case the
                      client builds it from the address it uses.
                  expiresAt: { type: string, format: date-time }
                  interval: { type: integer, description: Seconds between two polls }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/device/token:
    post:
      operationId: deviceLoginToken
      summary: Poll a phone sign-in and collect its session once approved
      description: The refresh token is always returned in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "409":
          description: Not approved yet (`authorization_pending`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown, expired, declined or already used (`device_login_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /device-logins/lookup:
    post:
      operationId: lookupDeviceLogin
      summary: Show which device waits for approval
      description: >
        The code is accepted in any case, with or without its dash. The lookup, approve and deny calls share a limit of
        10 per minute and user (doubling blocks up to 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginCode" }
      responses:
        "200":
          description: The request waits for approval
          content:
            application/json:
              schema:
                type: object
                required: [userCode, deviceName, expiresAt]
                properties:
                  userCode: { type: string }
                  deviceName: { type: string }
                  expiresAt: { type: string, format: date-time }
        "404":
          description: Invalid, expired or already used (`device_login_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /device-logins/approve:
    post:
      operationId: approveDeviceLogin
      summary: Sign the waiting device in as the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginCode" }
      responses:
        "204": { description: Approved; the device receives its session on its next poll }
        "404":
          description: Invalid, expired or already used (`device_login_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /device-logins/deny:
    post:
      operationId: denyDeviceLogin
      summary: Decline the waiting device; its next poll answers `device_login_invalid`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginCode" }
      responses:
        "204": { description: Declined }
        "404":
          description: Invalid, expired or already used (`device_login_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /me:
    get:
      operationId: getMe
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      summary: Change the caller's own preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoplayNext: { type: boolean, description: Start the next episode when one ends }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /me/avatar:
    put:
      operationId: setMyAvatar
      summary: Upload the caller's avatar (JPEG or PNG, max 2 MB; stored as a 256x256 PNG center crop)
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMyAvatar
      summary: Remove the caller's avatar
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  properties:
                    role: { $ref: "#/components/schemas/Role" }
                    locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Username already exists (`username_taken`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateUser
      summary: Update role, locale or password (admin)
      description: Changing the role or password revokes the user's refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                locale: { $ref: "#/components/schemas/Locale" }
                password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Would remove the last admin (`last_admin`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteUser
      summary: Delete a user (admin)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`last_admin` or `cannot_delete_self`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{id}/alias:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setUserAlias
      summary: Set or clear the alias of a user (admin)
      description: >
        The alias is a local label, shown by the clients instead of the username (`displayName`). It also applies to
        remote users of paired servers, survives their sync and is never sent to peers. Logins still use the username.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /invitations:
    get:
      operationId: listInvitations
      summary: List pending invitations (admin)
      description: Expired invitations are purged and never listed.
      responses:
        "200":
          description: Pending invitations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      summary: Invite someone to create their own account (admin)
      description: >
        Returns the invitation link and its 4-digit PIN once; only their hashes are stored. The link is the server
        public URL followed by `/invite#<token>`: the token sits in the fragment, so browsers never send it to a
        server. The invitation expires after 7 days and creates a `user` account.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    required: [url, pin]
                    properties:
                      url: { type: string, format: uri }
                      pin: { type: string, pattern: "^[0-9]{4}$" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: The server public URL is not set (`public_url_required`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteInvitation
      summary: Revoke a pending invitation (admin)
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /invitations/lookup:
    post:
      operationId: lookupInvitation
      summary: Check an invitation link before its form is filled in
      description: >
        The token is sent in the body so that it stays out of access logs. Shares the per-address limit of
        `acceptInvitation` (10 per minute, doubling blocks up to 15 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The invitation is usable
          content:
            application/json:
              schema:
                type: object
                required: [locale, expiresAt, serverName]
                properties:
                  locale: { $ref: "#/components/schemas/Locale" }
                  expiresAt: { type: string, format: date-time }
                  serverName: { type: string }
        "404":
          description: Invalid, expired or already used (`invitation_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Create the invited account and open a session
      description: >
        Single use: the invitation is consumed by the account creation. A wrong PIN counts against the invitation,
        which is revoked after 5 of them. Requests are also limited per client address (`rate_limited`, with
        `Retry-After`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - $ref: "#/components/schemas/SessionOptions"
                - type: object
                  required: [token, pin]
                  properties:
                    token: { type: string }
                    pin: { type: string, pattern: "^[0-9]{4}$" }
                    locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: Wrong PIN (`invalid_pin`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invalid, expired, used or revoked after too many wrong PINs (`invitation_invalid`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Username already exists (`username_taken`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /libraries:
    get:
      operationId: listLibraries
      summary: List libraries (paths are only included for admins)
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Library" }
    post:
      operationId: createLibrary
      summary: Create a library (admin)
      description: Paths must be directories inside the media roots and must not overlap paths of other libraries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, paths]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                kind: { $ref: "#/components/schemas/LibraryKind" }
                paths:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                restricted: { type: boolean, default: false, description: Only listed users (and admins) can see the library }
                userIds: { type: array, items: { type: string, format: uuid } }
                metadataLanguage:
                  type: string
                  pattern: "^[a-z]{2}-[A-Z]{2}$"
                  description: TMDB language for this library (e.g. pt-BR). Omitted or empty, the library follows the server-wide metadata language.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`name_taken` or `path_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /libraries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getLibrary
      summary: Get a library (404 when restricted and not shared with the caller)
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateLibrary
      summary: Rename a library, replace its paths or change its access and metadata language (admin)
      description: The kind cannot be changed after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                paths:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                restricted: { type: boolean }
                userIds:
                  type: array
                  description: Replaces the allowed users; kept when restricted is turned off.
                  items: { type: string, format: uuid }
                metadataLanguage:
                  type: string
                  description: |
                    TMDB language for this library (e.g. pt-BR). An empty string removes the override, so the library follows
                    the server-wide metadata language again. A change queues a scan that re-fetches the metadata.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`name_taken` or `path_conflict`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteLibrary
      summary: Delete a library (admin); media files are never touched
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /libraries/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listLibraryItems
      summary: Top-level entries of a library (movies, series or videos)
      parameters:
        - $ref: "#/components/parameters/CatalogFilters"
        - { name: query, in: query, required: false, schema: { type: string }, description: Substring of the title or original title, ignoring case and accents }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [title, year, added, rating, imdbRating, watched], default: title }, description: "rating: TMDB rating; imdbRating: IMDb public rating, unrated last; watched: most recently played first (the title or an episode), never played last" }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 60 } }
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemCard" } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /kinds/{kind}/items:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movies, series, other] } }
    get:
      operationId: listKindItems
      summary: Top-level entries of every readable library of one kind
      parameters:
        - $ref: "#/components/parameters/CatalogFilters"
        - { name: library, in: query, required: false, schema: { type: string, format: uuid }, description: Restrict to one library of this kind }
        - { name: query, in: query, required: false, schema: { type: string }, description: Substring of the title or original title, ignoring case and accents }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [title, year, added, rating, imdbRating, watched], default: title }, description: "rating: TMDB rating; imdbRating: IMDb public rating, unrated last; watched: most recently played first (the title or an episode), never played last" }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 60 } }
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ItemCard" } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  unavailableServers: { type: integer, description: "Number of excluded incompatible, unverified or unreachable peers. Paused peers are not counted." }
                  unavailableServerNames: { type: array, items: { type: string }, description: "Names of the excluded peers, in no particular order" }
        "400": { $ref: "#/components/responses/Error" }

  /search:
    get:
      operationId: search
      summary: Titles of every kind whose title or original title contains the query, including compatible peers
      description: >
        Searches the top-level entries of every readable library and of every paired peer. Versions of the same
        TMDB title are merged into one card. Within a kind, titles starting with the query come first, then the
        others in title order.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 3 }, description: Substring of the title or original title, ignoring case and accents; at least 3 characters once trimmed }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 12 }, description: Maximum number of items returned per kind }
      responses:
        "200":
          description: Matches grouped by kind
          content:
            application/json:
              schema:
                type: object
                required: [groups, unavailableServers, unavailableServerNames]
                properties:
                  groups:
                    type: array
                    description: Only the kinds with matches, in the order movies, series, other
                    items:
                      type: object
                      required: [kind, items, total]
                      properties:
                        kind: { type: string, enum: [movies, series, other] }
                        items: { type: array, items: { $ref: "#/components/schemas/ItemCard" } }
                        total: { type: integer, description: Number of matching titles of the kind, beyond the returned items }
                  unavailableServers: { type: integer, description: "Number of excluded incompatible, unverified or unreachable peers. Paused peers are not counted." }
                  unavailableServerNames: { type: array, items: { type: string }, description: "Names of the excluded peers, in no particular order" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /kinds/{kind}/filters:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movies, series] } }
    get:
      operationId: listCatalogFilterOptions
      summary: Suggestions from accessible titles with available media, including compatible peers
      parameters:
        - { name: library, in: query, schema: { type: string, format: uuid }, description: Limit to a local library and do not query peers }
        - $ref: "#/components/parameters/FilterCategory"
        - $ref: "#/components/parameters/FilterSearch"
        - $ref: "#/components/parameters/SelectedFilters"
        - $ref: "#/components/parameters/FilterLocale"
      responses:
        "200":
          description: Up to 50 suggestions per category, deduplicated by ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFilterOptions" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /federation/catalog/kinds/{kind}/items:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movies, series, other] } }
    get:
      operationId: peerKindItems
      summary: Local top-level entries of one kind for the shadow user named by a compatible peer's federated token
      description: >
        Serves pages of up to 20000 entries, so that a peer reads a whole catalog in one call; peers up to 0.5 serve
        200 at most and answer 400 above. The origin keeps the merged answer for a short time (90 s) and pages through it.
      parameters:
        - $ref: "#/components/parameters/CatalogFilters"
        - { name: query, in: query, required: false, schema: { type: string }, description: Substring of the title or original title, ignoring case and accents }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [title, year, added, rating, imdbRating, watched], default: title }, description: "rating: TMDB rating; imdbRating: IMDb public rating, unrated last; watched: most recently played first (the title or an episode), never played last" }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20000, default: 60 } }
      responses:
        "200":
          description: Local entries only, never re-exporting other peers, with the keys the origin merges and sorts on
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ItemCard"
                        - type: object
                          properties:
                            tmdbId: { type: [integer, "null"] }
                            sortTitle: { type: string }
                            addedAt: { type: string, format: date-time }
                            watchedOn: { type: string, format: date-time, description: Last time the user played the title or one of its episodes; absent when never played }
                            imdbRating: { type: number, description: IMDb public rating (0–10), used by the imdbRating sort; absent when unrated }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /federation/catalog/kinds/{kind}/filters:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [movies, series] } }
    get:
      operationId: peerCatalogFilterOptions
      summary: Local suggestions for the shadow user named by a compatible peer's federated token
      parameters:
        - $ref: "#/components/parameters/FilterCategory"
        - $ref: "#/components/parameters/FilterSearch"
        - $ref: "#/components/parameters/SelectedFilters"
        - $ref: "#/components/parameters/FilterLocale"
      responses:
        "200":
          description: Local suggestions only, never re-exporting other peers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFilterOptions" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /admin/federation/peers:
    get:
      operationId: listPeers
      summary: List paired servers with their current version and compatibility (admin)
      description: >
        Compatibility compares only SemVer major versions. Unknown or invalid versions are unverified. A peer is
        offline after two consecutive failed calls: aggregated answers then skip it, and the server probes it in the
        background (after 30 s, 1 min, then every 5 min) until it answers again. A paused peer is neither called nor
        probed. The status comes from these checks; a version older than five minutes is checked again.
      responses:
        "200":
          description: Paired servers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Peer" }
    post:
      operationId: addPeer
      summary: Pair a server from its pairing code (admin)
      description: >
        Pairing is mutual: the other server only answers this server's signed requests once its administrator has
        also paired this server. Until then the pairing is created but `pairingPending` is true and nothing is shared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Pairing code generated by the other server }
      responses:
        "201":
          description: Paired server
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Peer"
                  - type: object
                    required: [pairingPending]
                    properties:
                      pairingPending: { type: boolean, description: The other server has not paired this server back yet }
        "400": { description: "Invalid pairing code, own code, plain HTTP refused or key not proven (invalid_pairing_code, self_pairing, peer_requires_https, peer_rejected)" }
        "409": { description: The server is already paired (peer_exists) }
        "502": { description: The peer could not be reached (peer_unreachable) }

  /admin/federation/peers/{id}/paused:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: pausePeer
      summary: Pause or resume a paired server (admin)
      description: >
        A paused peer is left out of every aggregated answer without being counted as unavailable, is never probed,
        and no federated token is issued for it. It can still call this server. The pairing is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/federation/peers/{id}/alias:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setPeerAlias
      summary: Set or clear the alias of a paired server (admin)
      description: >
        The alias replaces the name the peer gave itself in every answer of this server: `displayName`, the
        `serverName` of item sources, `unavailableServerNames` and the `originServer` of remote users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AliasRequest" }
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/federation/peers/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: syncPeer
      summary: Synchronize users from a compatible peer (admin)
      responses:
        "200":
          description: Synchronized users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
        "409": { description: The peer does not use a valid version with the same major version }
        "502": { description: "The peer is unavailable or returned invalid data (peer_unreachable), or has not paired this server back (peer_not_paired)" }

  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getItem
      summary: Details of a movie, series, season, episode or video
      description: >
        Versions are the files of the item (several when the same title exists in different qualities or editions).
        Children are the seasons of a series or the episodes of a season.
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /items/{id}/progress:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putItemProgress
      summary: Record where the caller stopped watching a movie, episode or video
      description: >
        Clients call it periodically while playing, on pause and when leaving. Reaching 90% of the duration marks
        the item watched and clears its resume point; a watched item stays watched when played again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSeconds, durationSeconds]
              properties:
                positionSeconds: { type: number, minimum: 0 }
                durationSeconds: { type: number, minimum: 0, description: 0 when unknown (the item is then never marked watched) }
      responses:
        "200":
          description: Progress recorded
          content:
            application/json:
              schema:
                type: object
                required: [watched]
                properties:
                  watched: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /items/{id}/watched:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markWatched
      summary: Mark an item, or every episode of a series or season, as watched
      responses:
        "204": { description: Marked }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: markUnwatched
      summary: Mark as not watched and forget the resume points
      responses:
        "204": { description: Unmarked }
        "404": { $ref: "#/components/responses/Error" }

  /items/{id}/watchlist:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addToWatchlist
      summary: Add a movie, series or video to the caller's watchlist
      description: Idempotent; adding again keeps the first date. Accepts a federated token, so a title held by a paired server is listed on that server for the caller's shadow user.
      responses:
        "204": { description: Listed }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeFromWatchlist
      summary: Remove a title from the caller's watchlist
      description: >-
        Idempotent. Removes every copy of the title (same kind and TMDB ID) held by this server. For a local user, the
        copies listed on compatible paired servers are removed there too; unreachable peers keep theirs.
      responses:
        "204": { description: Not listed }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /kinds/{kind}/titles/{tmdbId}/sources:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ItemKind" } }
      - { name: tmdbId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listTitleSources
      summary: The servers holding a top-level title, this server first, and whether the caller watchlisted it
      description: Unreachable peers are left out.
      responses:
        "200":
          description: Copies of the title
          content:
            application/json:
              schema:
                type: object
                required: [sources, inWatchlist]
                properties:
                  sources: { type: array, items: { $ref: "#/components/schemas/MediaSource" } }
                  inWatchlist: { type: boolean, description: "Any copy of the title is in the caller's watchlist, on any server" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /kinds/{kind}/titles/{tmdbId}/watchlist:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ItemKind" } }
      - { name: tmdbId, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: removeTitleFromWatchlist
      summary: Remove a title from the caller's watchlist on this server and on every compatible paired server
      description: Idempotent; whichever copy of the title was added. Lets a client reading a peer's copy remove the title everywhere. The removal is forwarded to each paired server that reports the title listed, and to older peers that do not report it (every copy they hold is named).
      responses:
        "204": { description: Not listed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /me/watchlist:
    get:
      operationId: getWatchlist
      summary: The caller's watchlist aggregated across compatible servers, most recently added first
      description: At most 100 titles per server, in libraries the caller can access. A title added on several copies (libraries or servers) is listed once, as its latest addition. A peer that does not support the watchlist yet adds nothing; unreachable or incompatible peers are counted in unavailableServers.
      responses:
        "200":
          description: Local and federated watchlist entries with their source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "401": { $ref: "#/components/responses/Error" }

  /federation/watchlist:
    get:
      operationId: getPeerWatchlist
      summary: Local watchlist of the shadow user named by a compatible peer's federated token
      description: Does not query or re-export other peers. Library access rules apply to the authenticated shadow user.
      responses:
        "200":
          description: Local watchlist only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "401": { $ref: "#/components/responses/Error" }

  /me/home:
    get:
      operationId: getHome
      summary: Continue-watching and next-episode rows aggregated across compatible servers
      description: Each row is sorted by last progress update and limited to 20 items globally. Source identity is retained; positions of different copies are never merged. Excluded peers do not prevent local results. Existing individual home-row endpoints remain local-only.
      responses:
        "200":
          description: Local and federated home rows with their source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Error" }

  /federation/home:
    get:
      operationId: getPeerHome
      summary: Local home rows for the shadow user named by a compatible peer's federated token
      description: Does not query or re-export other peers. Library access rules apply to the authenticated shadow user.
      responses:
        "200":
          description: Local home rows only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Error" }

  /me/continue-watching:
    get:
      operationId: listContinueWatching
      summary: Items started and not finished, most recent first (at most 20)
      description: Only items resumable (at least 30 s in), in libraries the caller can access.
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HomeItem" } }

  /me/next-up:
    get:
      operationId: listNextUp
      summary: Next unwatched episode of each series the caller is following, most recent first (at most 20)
      description: >
        The episode after the furthest one watched; specials are ignored, and an episode already started is left
        to `continue-watching`.
      responses:
        "200":
          description: Episodes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HomeItem" } }

  /libraries/{id}/scan:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: scanLibrary
      summary: Queue a scan of the library (admin)
      description: Scans run one at a time. Queuing a library that is already queued or running returns its current status.
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/scans:
    get:
      operationId: listScans
      summary: Status of the scans run since the API started (admin)
      responses:
        "200":
          description: Scan statuses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ScanStatus" }

  /admin/fs/browse:
    get:
      operationId: browseFolders
      summary: Browse subdirectories of the media roots (admin)
      parameters:
        - name: path
          in: query
          required: false
          description: Absolute directory to list. When omitted, the media roots are returned.
          schema: { type: string }
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseResult" }
        "400":
          description: Path outside the media roots or not a directory (`invalid_path`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/settings:
    get:
      operationId: getSettings
      summary: Server settings (admin); the TMDB key is never returned
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      summary: Update settings (admin) and rescan every library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdbApiKey: { type: string, description: TMDB v3 key or v4 read token; empty string removes it. Checked against TMDB before saving. }
                metadataLanguage: { type: string, pattern: "^[a-z]{2}-[A-Z]{2}$", example: fr-FR }
                openSubtitlesApiKey: { type: string, description: "opensubtitles.com API key, write-only; empty string removes the whole OpenSubtitles configuration. Checked against OpenSubtitles before saving." }
                openSubtitlesUsername: { type: string, description: "Optional opensubtitles.com account raising the daily download quota; empty string removes the login" }
                openSubtitlesPassword: { type: string, description: "Password of that account, write-only; required with a new username" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400":
          description: "`validation`, `invalid_tmdb_key`, `invalid_opensubtitles_credentials` (API key rejected) or `invalid_opensubtitles_login` (username or password rejected); the message of the last two is the OpenSubtitles answer and HTTP status"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: OpenSubtitles rate limit hit while checking the login (`subtitles_rate_limited`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            TMDB or OpenSubtitles unreachable while checking the key (`tmdb_unreachable`, `subtitles_unreachable`), or
            OpenSubtitles answering with an unexpected error (`subtitles_rejected`, whose message is the OpenSubtitles
            message and HTTP status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /items/{id}/match/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: searchItemMatch
      summary: TMDB candidates for a movie or series (admin)
      parameters:
        - { name: query, in: query, required: false, schema: { type: string }, description: Defaults to the item title }
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [tmdbId, title, posterUrl]
                      properties:
                        tmdbId: { type: integer }
                        title: { type: string }
                        originalTitle: { type: string }
                        year: { type: integer }
                        overview: { type: string }
                        posterUrl: { type: [string, "null"], description: Direct TMDB URL }
        "409": { $ref: "#/components/responses/Error" }

  /items/{id}/match:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setItemMatch
      summary: Match a movie or series to a TMDB id (admin); the choice is locked against automatic matching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId]
              properties:
                tmdbId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: "Updated item, or `{merged: true}` when it was folded into an existing duplicate"
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`tmdb_not_configured` or `invalid_tmdb_key`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /items/{id}/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: refreshItem
      summary: Fetch metadata again for a movie, series or video (admin)
      responses:
        "200": { description: Updated item }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{id}/metadata:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: editItemMetadata
      summary: Edit the metadata of a movie, series or video by hand (admin)
      description: |
        Only the fields sent change. Each of them is added to the item's `editedFields`, which metadata refreshes
        (automatic or manual, including a new TMDB match) leave untouched until `revertItemMetadata`. An empty string
        clears an optional text field. The release date also sets the year. People already listed keep their
        TMDB ID and picture when their name is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 300 }
                originalTitle: { type: string, maxLength: 300 }
                releaseDate: { type: string, description: "YYYY-MM-DD, or empty to clear it" }
                tagline: { type: string, maxLength: 500 }
                overview: { type: string, maxLength: 10000 }
                directors: { type: array, maxItems: 20, description: Directors of a movie, creators of a series, items: { type: string } }
                cast:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 200 }
                      character: { type: string, maxLength: 200 }
      responses:
        "200": { description: Updated item }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revertItemMetadata
      summary: Drop the manual edits of a movie, series or video and fetch its metadata again (admin)
      description: |
        Movies and series need a TMDB key (`409 tmdb_not_configured` otherwise, and the edits stay). An edited value
        stays when there is nothing to replace it with (no TMDB match), but it is no longer locked.
      responses:
        "200": { description: "Updated item, or `{\"merged\": true}` when the refresh merged it into another one" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items/{id}/collection:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getItemCollection
      summary: List every other title of a movie's or video's collection (admin)
      description: Unlike `ItemDetail.collection`, titles of every library are listed, even when their files are missing.
      responses:
        "200":
          description: The other titles of the collection, in release order; empty when the item has none
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CollectionMember" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setItemCollection
      summary: Group a movie or video with other titles in a collection (admin)
      description: |
        The item and `itemIds` become one collection, whose titles list one another on their page. Titles of the
        item's collection that are not listed leave it, listed titles that belonged to another collection move to
        this one, and a collection left with a single title is dissolved. An empty `itemIds` takes only the item
        out of its collection. Only top-level movies and videos can be grouped (`400 validation` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, maxItems: 99, items: { type: string, format: uuid } }
      responses:
        "200":
          description: The other titles of the collection, as `getItemCollection` returns them
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CollectionMember" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/collection/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: searchItemCollectionCandidates
      summary: Find the movies and videos of every library that can join a title's collection (admin)
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 2 }, description: Part of the title or original title }
      responses:
        "200":
          description: Up to 20 matching titles, the item itself excluded
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CollectionMember" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/poster:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setItemPoster
      summary: Upload the poster of a movie or series (admin; JPEG or PNG, max 10 MB, stored as a JPEG of at most 1000x1500)
      description: The poster is added to the item's `editedFields`. `revertItemMetadata` brings back the TMDB poster.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated item }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /playback/sessions:
    post:
      operationId: startPlayback
      summary: Start an HLS playback session on a version (file) of an item
      description: |
        The server copies the video and audio streams the client can decode (`caps`) and transcodes the others,
        on the GPU when available. The stream starts at `start` (moved back to the previous keyframe when the
        video is copied), reported in the response: the position in the file is `session.start` plus the player time.

        Image subtitles (PGS, VobSub) are burned into the picture, so changing them needs a new session.
        Text subtitles are served as WebVTT aligned on the stream start.

        A session is private to its user and expires after 5 minutes without request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, caps]
              properties:
                versionId: { type: string, format: uuid, description: "Id of a version returned by `getItem`" }
                audioIndex: { type: [integer, "null"], description: Stream index; the default track when omitted }
                subtitleIndex: { type: [integer, "null"], description: Stream index; none when omitted }
                externalSubtitleId:
                  type: [string, "null"]
                  format: uuid
                  description: "A downloaded subtitle of this version (`Version.externalSubtitles`), served at `subtitleUrl`; exclusive with `subtitleIndex`. Omit it when unset: servers older than this field refuse unknown fields."
                start: { type: number, minimum: 0, default: 0, description: Seconds from the start of the file }
                caps: { $ref: "#/components/schemas/ClientCaps" }
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSession" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503":
          description: Too many videos are being transcoded (`transcoder_busy`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playback/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: stopPlayback
      summary: Stop a session and free its resources
      responses:
        "204": { description: Stopped }
        "404": { $ref: "#/components/responses/Error" }

  /stream/{sid}/{file}:
    get:
      operationId: getStreamFile
      summary: HLS playlist (`index.m3u8`), initialisation segment (`init.mp4`) or media segment (`seg_00012.m4s`)
      description: >
        Public: the unguessable session id is the credential, because players cannot add a bearer token to every
        segment request. Waits up to 20 seconds for the transcoder to produce the file.
      security: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, example: index.m3u8 } }
      responses:
        "200":
          description: Stream file
          content:
            application/vnd.apple.mpegurl: {}
            video/mp4: {}
            video/iso.segment: {}
        "404": { $ref: "#/components/responses/Error" }
        "503":
          description: Not produced yet (`not_ready`), retry after the delay in `Retry-After`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stream/{sid}/subtitles/{track}:
    get:
      operationId: getStreamSubtitles
      summary: Text subtitle track of a session as WebVTT, aligned on the stream start
      description: |
        While the full extraction is not finished, the cues produced so far are returned with
        `X-Subtitles-Complete: false`: fetch again later. The final file is served with `X-Subtitles-Complete: true`.
        `202` means the extraction of another track is still running; retry after `Retry-After`.
      security: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
        - { name: track, in: path, required: true, schema: { type: string, example: "3.vtt" }, description: "Stream index followed by `.vtt`, or `external.vtt` for the downloaded subtitle of the session (always complete)" }
      responses:
        "200":
          description: WebVTT
          headers:
            X-Subtitles-Complete: { schema: { type: string, enum: ["true", "false"] } }
          content:
            text/vtt: {}
        "202": { description: Extraction in progress }
        "404": { $ref: "#/components/responses/Error" }

  /items/{id}/subtitles/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: searchSubtitles
      summary: Search subtitles for a version on OpenSubtitles
      description: |
        Available to local and federated users who can play the item, when `ItemDetail.subtitleSearch` is true.
        Movies are looked up by TMDB id, episodes by the series TMDB id with season and episode numbers, other videos
        by title; the hash of the file is always sent, and results made for this exact file (`hashMatch`) come first,
        then the most downloaded. Subtitles split over several files are left out.
      parameters:
        - { name: versionId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: language, in: query, required: true, schema: { type: string, pattern: "^[a-z]{2}(-[A-Za-z]{2})?$", example: pt-BR }, description: "OpenSubtitles language code: ISO 639-1, or with a region (pt-BR, pt-PT, zh-CN, zh-TW)" }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/SubtitleResult" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Online search not configured (`subtitles_not_configured`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: OpenSubtitles rate limit (`subtitles_rate_limited`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "OpenSubtitles unreachable (`subtitles_unreachable`), rejecting the server credentials (`subtitles_unauthorized`) or answering with another error (`subtitles_rejected`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /items/{id}/subtitles:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: downloadSubtitle
      summary: Download a search result and keep it for the version
      description: |
        The subtitle is converted to WebVTT, stored in the database and listed in `Version.externalSubtitles` for
        every user who can play the version. Downloading a file already stored returns it without using the
        OpenSubtitles quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, fileId, language]
              properties:
                versionId: { type: string, format: uuid }
                fileId: { type: integer, minimum: 1, description: "`SubtitleResult.fileId`" }
                language: { type: string, example: fr }
                release: { type: string, maxLength: 255 }
                hearingImpaired: { type: boolean, default: false }
      responses:
        "200":
          description: Already downloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSubtitle" }
        "201":
          description: Downloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSubtitle" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Online search not configured (`subtitles_not_configured`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Daily OpenSubtitles download quota reached (`subtitles_quota`) or rate limit (`subtitles_rate_limited`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`subtitles_unreachable`, `subtitles_unauthorized`, `subtitles_rejected`, or a file that is not a readable subtitle (`subtitles_invalid`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /items/{id}/subtitles/{subtitleId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: subtitleId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteSubtitle
      summary: Delete a downloaded subtitle (admin)
      parameters:
        - { name: versionId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /admin/system/transcoding:
    get:
      operationId: getTranscodingInfo
      summary: Hardware acceleration in use and running sessions (admin)
      responses:
        "200":
          description: Transcoding state
          content:
            application/json:
              schema:
                type: object
                required: [accel, sessions]
                properties:
                  accel: { type: string, enum: [qsv, vaapi, none] }
                  device: { type: string, example: /dev/dri/renderD128 }
                  sessions: { type: integer }
  /images/tmdb/{size}/{file}:
    get:
      operationId: getTmdbImage
      summary: TMDB image cached by the server (public so that img tags work)
      description: Only images referenced by the catalogue are served.
      security: []
      parameters:
        - { name: size, in: path, required: true, schema: { type: string, enum: [w92, w185, w300, w342, w500, w780, w1280, original] } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}\\.(jpg|png)$" } }
      responses:
        "200": { description: Image, content: { image/jpeg: {}, image/png: {} } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /images/avatars/{id}:
    get:
      operationId: getUserAvatar
      summary: Avatar of a user (public)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Avatar, content: { image/png: {} } }
        "404": { $ref: "#/components/responses/Error" }

  /images/local/{file}:
    get:
      operationId: getLocalImage
      summary: Thumbnail extracted from a personal video (public)
      security: []
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, example: 5f1c2b3a-0000-0000-0000-000000000000.jpg } }
      responses:
        "200": { description: Image, content: { image/jpeg: {} } }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    CatalogFilters:
      name: filters
      in: query
      description: URL-encoded JSON object, at most 8192 bytes. Criteria use AND; selections within one criterion use OR. Resolution and audio match a title when at least one of its available files (a movie version or a series episode) matches. Missing values fail active inclusion or range criteria; excluded genres only remove known matches. For duplicate TMDB titles, at least one source must satisfy all criteria.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CatalogFilters" }
    FilterCategory:
      name: category
      in: query
      schema: { type: string, enum: [genres, actors, creators, keywords, languages, countries] }
    FilterSearch:
      name: query
      in: query
      schema: { type: string, maxLength: 200 }
      description: Substring of the suggestion label, ignoring case and accents
    SelectedFilters:
      name: selected
      in: query
      description: Up to 20 comma-separated IDs whose accessible labels should be included regardless of the search text
      schema: { type: string, maxLength: 500 }
    FilterLocale:
      name: locale
      in: query
      description: Display and search language for ISO country and language names
      schema: { type: string, enum: [fr, en, pt-BR], default: fr }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Session:
      description: Session opened
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    CatalogFilters:
      type: object
      additionalProperties: false
      description: The genreMode key sent by clients up to 0.3 is still accepted and ignored.
      properties:
        genres: { $ref: "#/components/schemas/TMDBFilterIDs" }
        excludeGenres: { $ref: "#/components/schemas/TMDBFilterIDs" }
        actors: { $ref: "#/components/schemas/TMDBFilterIDs" }
        creators: { $ref: "#/components/schemas/TMDBFilterIDs", description: Movie directors or series creators }
        keywords: { $ref: "#/components/schemas/TMDBFilterIDs" }
        languages: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-zA-Z]{2}$" }, description: "Original language, normalized to lowercase" }
        countries: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-zA-Z]{2}$" }, description: "Movie production countries or series countries of origin, normalized to uppercase" }
        yearMin: { type: integer, minimum: 1800, maximum: 9999 }
        yearMax: { type: integer, minimum: 1800, maximum: 9999 }
        ratingMin: { type: number, minimum: 0, maximum: 10 }
        votesMin: { type: integer, minimum: 0, maximum: 2147483647 }
        runtimeMin: { type: integer, minimum: 0, maximum: 10000, description: "Minutes, movies only" }
        runtimeMax: { type: integer, minimum: 0, maximum: 10000, description: "Minutes, movies only" }
        resolution:
          type: string
          enum: ["2160p", "1080p", "720p", "SD"]
          description: Resolution class of the first video stream of a file; the width counts too, so 1920x800 is 1080p
        audio:
          type: string
          enum: [atmos, truehd, eac3, ac3, dtsHdMa, dts, flac, pcm, aac, opus, mp3]
          description: "Sound format of one of the audio streams of a file: atmos (Dolby Atmos, over TrueHD or E-AC-3), truehd (Dolby TrueHD), eac3 (Dolby Digital Plus), ac3 (Dolby Digital), dtsHdMa (DTS-HD Master Audio), dts (any DTS, HD included), pcm (uncompressed)"
    TMDBFilterIDs:
      type: array
      maxItems: 20
      items: { type: integer, minimum: 1, maximum: 2147483647 }
    CatalogFilterOptions:
      type: object
      required: [options, unavailableServers, unavailableServerNames]
      properties:
        unavailableServers: { type: integer }
        unavailableServerNames: { type: array, items: { type: string }, description: "Names of the excluded peers, in no particular order" }
        options:
          type: object
          additionalProperties:
            type: array
            maxItems: 50
            items:
              type: object
              required: [id, label]
              properties:
                id: { type: string }
                label: { type: string }
    Peer:
      type: object
      required: [id, url, name, alias, displayName, version, localVersion, status, versionCheckedAt, paused, lastSeenAt, offlineSince]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        name: { type: string, description: Name the peer gave itself }
        alias: { type: [string, "null"], description: Local label set by an admin of this server }
        displayName: { type: string, description: The alias, or the name without one }
        version: { type: [string, "null"] }
        localVersion: { type: string }
        status: { type: string, enum: [compatible, incompatible, unverified, offline, paused] }
        versionCheckedAt: { type: [string, "null"], format: date-time }
        paused: { type: boolean }
        lastSeenAt: { type: [string, "null"], format: date-time, description: Last time the peer answered or called this server }
        offlineSince: { type: [string, "null"], format: date-time, description: Set while the peer is offline }
    ClientCaps:
      type: object
      description: What the client can decode or output directly; the server transcodes the rest.
      required: [videoCodecs, audioCodecs]
      properties:
        videoCodecs: { type: array, items: { type: string, enum: [h264, hevc, av1] } }
        audioCodecs: { type: array, items: { type: string, enum: [aac, mp3, opus, flac, ac3, eac3, alac] } }
        preferredAudioCodec:
          type: string
          enum: ["", ac3, eac3]
          default: ""
          description: Preferred direct-output codec for multichannel audio. Must be in audioCodecs. Supported Dolby streams remain copied; other multichannel formats are converted to this codec, capped at six channels. Empty preserves the default policy.
        hdr: { type: boolean, default: false, description: The display can show HDR; otherwise HDR video is tone mapped }
        maxHeight: { type: integer, default: 0, description: "Largest picture height the client accepts, 0 for no limit (transcoding is capped at 1080)" }
    PlaybackSession:
      type: object
      required: [id, playlistUrl, start, duration, copyVideo, copyAudio, accel, audioIndex, subtitleIndex, subtitleUrl, burnedSubtitle]
      properties:
        id: { type: string }
        playlistUrl: { type: string, example: /api/v1/stream/0f3c/index.m3u8 }
        start: { type: number, description: "Position of the stream start in the file, in seconds" }
        duration: { type: number, description: "Duration of the whole file, in seconds" }
        copyVideo: { type: boolean }
        copyAudio: { type: boolean }
        accel: { type: string, enum: [qsv, vaapi, none] }
        audioIndex: { type: [integer, "null"] }
        subtitleIndex: { type: [integer, "null"] }
        externalSubtitleId: { type: [string, "null"], format: uuid }
        subtitleUrl: { type: [string, "null"], description: WebVTT of the selected text subtitle track or downloaded subtitle }
        burnedSubtitle: { type: boolean }
    Role:
      type: string
      enum: [admin, user]
    Locale:
      type: string
      enum: [fr, en, pt-BR]
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9._-]{3,32}$" }
        password: { type: string, minLength: 8, maxLength: 256 }
    SessionOptions:
      type: object
      properties:
        deviceName: { type: string, maxLength: 100 }
        tokenDelivery:
          type: string
          enum: [cookie, body]
          default: body
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }
    AliasRequest:
      type: object
      required: [alias]
      properties:
        alias:
          type: [string, "null"]
          maxLength: 64
          description: Trimmed; null or an empty string removes the alias.
    User:
      type: object
      required: [id, username, alias, displayName, role, locale, autoplayNext, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: Login name }
        alias: { type: [string, "null"], description: Label given by an admin }
        displayName: { type: string, description: The alias, or the username without one; the name clients show }
        role: { $ref: "#/components/schemas/Role" }
        locale: { $ref: "#/components/schemas/Locale" }
        autoplayNext: { type: boolean, default: false }
        avatarUpdatedAt: { type: string, format: date-time, description: Present only when the user has an avatar; used as cache-buster }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, locale, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        locale: { $ref: "#/components/schemas/Locale" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresAt: { type: string, format: date-time }
        refreshToken:
          type: string
          description: Present only when `tokenDelivery` is `body`.
        user: { $ref: "#/components/schemas/User" }
    ItemKind:
      type: string
      enum: [movie, series, season, episode, video]
    CollectionMember:
      type: object
      required: [id, kind, title, year, posterUrl]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [movie, video] }
        title: { type: string }
        year: { type: [integer, "null"] }
        posterUrl: { type: [string, "null"], description: Poster, or thumbnail of a video }
    ItemCard:
      type: object
      required: [id, kind, title, year, posterUrl, rating, matchStatus]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        year: { type: [integer, "null"] }
        posterUrl: { type: [string, "null"] }
        rating: { type: [number, "null"] }
        episodeCount: { type: integer }
        matchStatus: { type: string, enum: [pending, matched, unmatched, manual, skipped] }
        watched: { type: boolean, description: "Movie or video watched by the caller, or series whose episodes are all watched" }
        unwatchedCount: { type: integer, description: Episodes of a series the caller has not watched yet }
    Track:
      type: object
      required: [index, codec, default]
      properties:
        index: { type: integer, description: Stream index in the file }
        language: { type: string, description: ISO 639-2 code }
        codec: { type: string }
        title: { type: string }
        channels: { type: integer }
        default: { type: boolean }
        forced: { type: boolean }
        imageBased: { type: boolean, description: Bitmap subtitles that must be burned in }
    ExternalSubtitle:
      type: object
      required: [id, language, release, hearingImpaired, source]
      properties:
        id: { type: string, format: uuid }
        language: { type: string, example: pt-BR, description: OpenSubtitles language code }
        release: { type: string, example: Blade.Runner.1982.1080p.BluRay }
        hearingImpaired: { type: boolean }
        source: { type: string, enum: [opensubtitles] }
    SubtitleResult:
      type: object
      required: [fileId, language, release, downloadCount, hearingImpaired, machineTranslated, trusted, hashMatch]
      properties:
        fileId: { type: integer }
        language: { type: string }
        release: { type: string }
        downloadCount: { type: integer }
        hearingImpaired: { type: boolean }
        machineTranslated: { type: boolean, description: AI or machine translation }
        trusted: { type: boolean, description: Uploaded by a trusted OpenSubtitles member }
        hashMatch: { type: boolean, description: Made for this exact file (same OpenSubtitles hash) }
        fps: { type: number }
        uploader: { type: string }
    Version:
      type: object
      required: [id, label, hdr, edition, size, durationSeconds, audio, subtitles, externalSubtitles]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: "2160p · HDR · HEVC · Extended" }
        resolution: { type: string, enum: [2160p, 1080p, 720p, SD] }
        hdr: { type: boolean }
        videoCodec: { type: string }
        edition: { type: [string, "null"] }
        size: { type: integer, format: int64 }
        durationSeconds: { type: [number, "null"] }
        audio: { type: array, items: { $ref: "#/components/schemas/Track" } }
        subtitles: { type: array, items: { $ref: "#/components/schemas/Track" } }
        externalSubtitles: { type: array, items: { $ref: "#/components/schemas/ExternalSubtitle" }, description: Subtitles downloaded online for this file }
        error: { type: string, description: Analysis error; the version may not play }
        path:
          type: string
          example: /media/movies/Blade Runner (1982)/Blade.Runner.1982.1080p.mkv
          description: Absolute path of the file on the server (inside its media mount). Only sent to local admins, never to regular users nor to federated peers.
    ItemDetail:
      type: object
      required: [id, kind, libraryId, title, genres, directors, cast, matchStatus, ancestors, versions, children]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        libraryId: { type: string, format: uuid }
        title: { type: string, description: Empty for episodes without metadata }
        originalTitle: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        overview: { type: [string, "null"] }
        tagline: { type: [string, "null"] }
        releaseDate: { type: [string, "null"], format: date-time }
        runtimeMinutes: { type: [integer, "null"] }
        rating: { type: [number, "null"], description: TMDB rating (0–10) }
        imdbId: { type: [string, "null"] }
        imdbRating: { type: [number, "null"], description: "IMDb public rating (0–10), refreshed daily from IMDb's free dataset (title.ratings.tsv.gz)" }
        imdbVotes: { type: [integer, "null"], description: Number of IMDb votes behind imdbRating }
        genres: { type: array, items: { type: string } }
        directors: { type: array, items: { type: string }, description: Directors of a movie or creators of a series }
        directorCredits:
          type: array
          description: >
            The same people as directors, with their picture. Empty for titles whose metadata was not refreshed since
            this field was added, and absent from older servers; clients then fall back to directors.
          items:
            type: object
            required: [name, photoUrl]
            properties:
              id: { type: integer, description: "TMDB person ID, the value of the creators catalog filter. Absent when unknown." }
              name: { type: string }
              photoUrl: { type: [string, "null"] }
        cast:
          type: array
          items:
            type: object
            required: [name, photoUrl]
            properties:
              id: { type: integer, description: "TMDB person ID, the value of the actors catalog filter. Absent when unknown." }
              name: { type: string }
              character: { type: string }
              photoUrl: { type: [string, "null"] }
        posterUrl: { type: [string, "null"] }
        backdropUrl: { type: [string, "null"] }
        logoUrl:
          type: [string, "null"]
          description: TMDB title logo (PNG with transparency), shown by the players while paused. Seasons and episodes carry the logo of their series. Absent from older servers.
        thumbUrl: { type: [string, "null"] }
        tmdbId: { type: [integer, "null"] }
        matchStatus: { type: string, enum: [pending, matched, unmatched, manual, skipped] }
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        episodeNumberEnd: { type: integer }
        ancestors:
          type: array
          description: Series then season for an episode.
          items:
            type: object
            required: [id, kind, title]
            properties:
              id: { type: string, format: uuid }
              kind: { $ref: "#/components/schemas/ItemKind" }
              title: { type: string }
              seasonNumber: { type: integer }
        versions: { type: array, items: { $ref: "#/components/schemas/Version" } }
        watched: { type: boolean, description: "The item, or everything under a series or season, is watched by the caller" }
        positionSeconds: { type: number, description: "Resume point of a playable item, 0 when none (under 30 s or watched)" }
        inWatchlist: { type: boolean, description: "A top-level title (movie, series, video) the caller added to their watchlist, through this copy or another copy of the same title. For a local user, copies held by compatible paired servers count too." }
        subtitleSearch: { type: boolean, description: "Subtitles can be searched online (`searchSubtitles`) for the versions of this item" }
        folder:
          type: string
          description: Deepest folder on the server (inside its media mount) holding every file of the item and of the items below it (seasons, episodes). Only sent to local admins, never to regular users nor to federated peers; omitted when the item has no file.
        collection:
          type: array
          items: { $ref: "#/components/schemas/ItemCard" }
          description: Other titles an administrator grouped with this movie or video (`setItemCollection`) that the caller can read and that have a file, in release order. Absent from older servers.
        editedFields:
          type: array
          items: { type: string, enum: [title, originalTitle, releaseDate, tagline, overview, directors, cast, poster] }
          description: Fields an administrator edited (`editItemMetadata`, `setItemPoster`), which metadata refreshes keep. Only sent to local admins; omitted when nothing was edited.
        playTarget:
          description: What "play" starts on a series or season. Null for playable items and when nothing is available.
          oneOf: [{ $ref: "#/components/schemas/PlayTarget" }, { type: "null" }]
        next:
          description: Item following an episode in viewing order. Null for the last one and other kinds.
          oneOf: [{ $ref: "#/components/schemas/PlayTarget" }, { type: "null" }]
        children:
          type: array
          items:
            type: object
            required: [id, kind, title]
            properties:
              id: { type: string, format: uuid }
              kind: { $ref: "#/components/schemas/ItemKind" }
              title: { type: string }
              overview: { type: [string, "null"] }
              year: { type: [integer, "null"] }
              releaseDate: { type: [string, "null"], format: date-time }
              runtimeMinutes: { type: [integer, "null"] }
              rating: { type: [number, "null"] }
              posterUrl: { type: [string, "null"] }
              thumbUrl: { type: [string, "null"] }
              seasonNumber: { type: integer }
              episodeNumber: { type: integer }
              episodeNumberEnd: { type: integer }
              childCount: { type: integer }
              watched: { type: boolean }
              positionSeconds: { type: number, description: "Resume point, 0 when none" }
              unwatchedCount: { type: integer, description: Episodes of a season the caller has not watched yet }
    PlayTarget:
      type: object
      required: [id, kind, title, positionSeconds, resume, rewatch]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        positionSeconds: { type: number }
        resume: { type: boolean, description: The target was started and resumes at positionSeconds }
        rewatch: { type: boolean, description: Everything was already watched; the target is the first item }
    MediaSource:
      type: object
      required: [serverId, serverName, itemId]
      properties:
        serverId: { type: string, format: uuid }
        serverName: { type: string }
        serverUrl: { type: string, format: uri, description: Omitted for items on the origin server }
        itemId: { type: string, format: uuid }
    SourcedHomeItem:
      allOf:
        - $ref: "#/components/schemas/HomeItem"
        - type: object
          required: [source]
          properties:
            source: { $ref: "#/components/schemas/MediaSource" }
    Home:
      type: object
      required: [continueWatching, nextUp, unavailableServers, unavailableServerNames]
      properties:
        continueWatching: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SourcedHomeItem" } }
        nextUp: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SourcedHomeItem" } }
        unavailableServers: { type: integer, minimum: 0 }
        unavailableServerNames: { type: array, items: { type: string }, description: "Names of the excluded peers, in no particular order" }
    WatchlistItem:
      type: object
      required: [id, kind, title, year, posterUrl, addedAt, source]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string }
        year: { type: [integer, "null"] }
        tmdbId: { type: [integer, "null"], description: "Groups the copies of a title; absent from older peers" }
        posterUrl: { type: [string, "null"] }
        addedAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/MediaSource" }
    Watchlist:
      type: object
      required: [items, unavailableServers, unavailableServerNames]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WatchlistItem" } }
        unavailableServers: { type: integer, minimum: 0 }
        unavailableServerNames: { type: array, items: { type: string }, description: "Names of the excluded peers, in no particular order" }
    HomeItem:
      type: object
      required: [id, kind, title, posterUrl, positionSeconds, durationSeconds, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ItemKind" }
        title: { type: string, description: "Title of the movie, episode or video" }
        showTitle: { type: string, description: "Series title for an episode" }
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        posterUrl: { type: [string, "null"] }
        positionSeconds: { type: number }
        durationSeconds: { type: number }
        updatedAt: { type: string, format: date-time }
    Settings:
      type: object
      required: [tmdbConfigured, metadataLanguage]
      properties:
        tmdbConfigured: { type: boolean }
        metadataLanguage: { type: string, example: fr-FR }
        openSubtitlesConfigured: { type: boolean, description: An OpenSubtitles API key is set; the key itself is never returned }
        openSubtitlesUsername: { type: string, description: OpenSubtitles login, empty when downloads are anonymous }
    LibraryKind:
      type: string
      enum: [movies, series, other]
    Library:
      type: object
      required: [id, name, kind, lastScannedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        paths:
          type: array
          description: Only returned to admins.
          items: { type: string }
        counts:
          type: object
          description: Number of items per kind (movie, series, season, episode, video). Only returned by the list endpoint.
          additionalProperties: { type: integer }
        matchCounts:
          type: object
          description: Admin only. Movies, series and videos per metadata status (pending, matched, unmatched, manual, skipped).
          additionalProperties: { type: integer }
        lastScannedAt: { type: [string, "null"], format: date-time }
        restricted: { type: boolean }
        metadataLanguage:
          type: [string, "null"]
          description: TMDB language overriding the server-wide one for this library; null when the library follows the server setting.
        userIds:
          type: array
          description: Admin only. Users allowed when the library is restricted.
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ScanStatus:
      type: object
      required: [libraryId, state, total, processed, added, probed, unmatched, failed, missing, incomplete]
      properties:
        libraryId: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, done, failed] }
        stage: { type: string, enum: [files, metadata] }
        total: { type: integer, description: Video files found }
        processed: { type: integer }
        added: { type: integer, description: "New movies, episodes or videos" }
        probed: { type: integer, description: New or modified files analysed with ffprobe }
        unmatched: { type: integer, description: Files whose name could not be understood }
        failed: { type: integer, description: Files ffprobe could not read }
        missing: { type: integer, description: "Files no longer found, kept for 7 days before removal" }
        incomplete:
          type: boolean
          description: A folder was unreachable or empty, so no file was flagged as missing.
        metaTotal: { type: integer, description: Items needing metadata in this pass }
        metaDone: { type: integer }
        metaError: { type: string, description: "Metadata failure that did not stop the scan (TMDB down, invalid key)" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { type: string }
    BrowseResult:
      type: object
      required: [path, parent, entries]
      properties:
        path:
          type: [string, "null"]
          description: Listed directory, null when listing the media roots.
        parent:
          type: [string, "null"]
          description: Parent directory, null when going up leads back to the media roots.
        entries:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
    DeviceLoginCode:
      type: object
      required: [userCode]
      properties:
        userCode: { type: string, example: BCDF-GHJK }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
